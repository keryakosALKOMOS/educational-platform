<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Platform - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="guest">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform
            </a>
            <div class="nav-links">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="login.html" data-i18n="nav_login" class="btn btn-secondary auth-guest">Login</a>
                <select id="langSwitcher" class="form-control" style="width: auto; padding: 0.25rem 0.5rem; height: auto;">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="container flex justify-center items-center mt-8">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 data-i18n="register_title" class="text-center mb-4">Create Account</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" data-i18n="name">Full Name</label>
                    <input type="text" id="name" class="form-control" data-i18n="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="email">Email Address</label>
                    <input type="email" id="email" class="form-control" data-i18n="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="password">Password</label>
                    <input type="password" id="password" class="form-control" data-i18n="password" required>
                </div>
                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Class Day (Optional)</label>
                        <select id="class_day" class="form-control">
                            <option value="">Select Day</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Class Time (Optional)</label>
                        <select id="class_hour" class="form-control">
                            <option value="">Select Time</option>
                            <option value="08:00 AM">08:00 AM</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                            <option value="06:00 PM">06:00 PM</option>
                            <option value="07:00 PM">07:00 PM</option>
                            <option value="08:00 PM">08:00 PM</option>
                            <option value="09:00 PM">09:00 PM</option>
                            <option value="10:00 PM">10:00 PM</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="nav_register">Register</button>
            </form>
            <p class="text-center mt-4">
                <a href="login.html" data-i18n="nav_login">Login</a>
            </p>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const day = document.getElementById('class_day').value;
            const hour = document.getElementById('class_hour').value;
            const class_time = (day && hour) ? `${day} ${hour}` : (day || hour || '');
            
            try {
                const data = await window.app.apiCall('/auth/register', 'POST', { name, email, password, class_time });
                window.app.setAuth(data.token, data.user);
                window.location.href = '/dashboard.html';
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        });
    </script>
</body>
</html>
