<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Codes - Educational Platform</title>
    <style>
        body {
            font-family: monospace;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls h2 {
            font-family: sans-serif;
            margin-bottom: 12px;
            color: #1e293b;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 4px;
            margin: 0 4px;
        }
        button.close-btn { background: #ef4444; }
        
        /* A4 Page Layout: 2 columns, 10 rows (20 codes per page) */
        .page {
            width: 210mm;
            height: 297mm;
            padding: 15mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            page-break-after: always;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(10, 1fr);
            gap: 15px; /* Spacing for easy cutting */
        }
        .code-box {
            border: 2px dashed #999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            page-break-inside: avoid;
            background-color: #fafafa;
        }
        .code-box small {
            display: block;
            font-size: 14px;
            color: #666;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: normal;
        }
        @media print {
            body { background: white; padding: 0; }
            .controls { display: none; }
            .page { 
                box-shadow: none; 
                margin: 0; 
                padding: 10mm; /* Printer margins */
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2 id="pageTitle">Print Codes (A4)</h2>
        <button onclick="window.print()">🖨 Print</button>
        <button class="close-btn" onclick="window.close()">✕ Close</button>
    </div>

    <div id="printContainer">
        <div class="page" style="display:flex; justify-content:center; align-items:center; color:#999; font-family:sans-serif;">
            Loading...
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!window.app.token || window.app.user?.role !== 'admin') {
            document.body.innerHTML = '<h1 style="text-align:center;color:red;">Access Denied. Admins only.</h1>';
        } else {
            const params = new URLSearchParams(window.location.search);
            const batchId = params.get('batch');

            if (batchId) {
                document.title = `Print Batch #${batchId} - Educational Platform`;
                document.getElementById('pageTitle').textContent = `Batch #${batchId} — Available Codes`;
                loadBatchCodes(batchId);
            } else {
                document.getElementById('pageTitle').textContent = 'All Available Codes';
                loadAllUnusedCodes();
            }
        }

        async function loadBatchCodes(batchId) {
            try {
                const data = await window.app.apiCall('/codes/batch/' + batchId);
                const unused = data.codes.filter(c => !c.is_used);
                renderCodes(unused, `Batch #${batchId}`);
            } catch (err) {
                alert('Error loading codes: ' + err.message);
            }
        }

        async function loadAllUnusedCodes() {
            try {
                const data = await window.app.apiCall('/codes');
                const unused = data.codes.filter(c => !c.is_used);
                renderCodes(unused.slice(0, 500), null);
            } catch (err) {
                alert('Error loading codes: ' + err.message);
            }
        }

        function renderCodes(codes, batchLabel) {
            const container = document.getElementById('printContainer');
            container.innerHTML = '';

            if (codes.length === 0) {
                container.innerHTML = '<div class="page" style="display:flex; justify-content:center; align-items:center; color:#999; font-family:sans-serif;">No available codes found.</div>';
                return;
            }

            // Chunk codes into pages of 20 (2 columns x 10 rows)
            const CODES_PER_PAGE = 20;
            const totalPages = Math.ceil(codes.length / CODES_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                const pageChunk = codes.slice(i * CODES_PER_PAGE, (i + 1) * CODES_PER_PAGE);
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                
                pageChunk.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'code-box';
                    div.innerHTML = `<div>${c.code}</div>` + (batchLabel ? `<small>${batchLabel}</small>` : '');
                    pageDiv.appendChild(div);
                });
                
                container.appendChild(pageDiv);
            }
        }
    </script>
</body>
</html>
