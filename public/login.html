<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Platform - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="guest">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform
            </a>
            <div class="nav-links">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="register.html" data-i18n="nav_register" class="btn btn-secondary auth-guest">Register</a>
                <select id="langSwitcher" class="form-control" style="width: auto; padding: 0.25rem 0.5rem; height: auto;">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container flex justify-center items-center mt-8">
        <div class="card" style="width: 100%; max-width: 400px;">
            <h2 data-i18n="login_title" class="text-center mb-4">Welcome Back</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" data-i18n="email">Email Address</label>
                    <input type="email" id="email" class="form-control" data-i18n="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" data-i18n="password">Password</label>
                    <input type="password" id="password" class="form-control" data-i18n="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="nav_login">Login</button>
            </form>
            <p class="text-center mt-4">
                <a href="register.html" data-i18n="nav_register">Create Account</a>
            </p>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const data = await window.app.apiCall('/auth/login', 'POST', { email, password });
                window.app.setAuth(data.token, data.user);
                
                if (data.user.role === 'admin') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/dashboard.html';
                }
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        });
    </script>
</body>
</html>
