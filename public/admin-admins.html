<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Administrators - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
        th { background: var(--surface-hover); }
        .perm-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            background: rgba(79,70,229,0.1);
            color: var(--primary);
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0.1rem;
            font-weight: 600;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .perm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .perm-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body data-auth="guest">

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform Admin
            </a>
            <div class="nav-links">
                <a href="admin.html">Admin Panel</a>
                <a href="#" class="btn btn-secondary logout-btn auth-user">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-8">
        <div class="flex items-center justify-between mb-6">
            <h2>👥 Manage Admin Accounts</h2>
            <button class="btn btn-primary" onclick="openModal()">Add New Admin</button>
        </div>

        <div class="card p-0" style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Permissions</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminsBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" class="mb-4">Add Administrator</h3>
            <form id="adminForm">
                <input type="hidden" id="adminId">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="aName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="aEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span id="pwdHint" class="text-muted" style="font-size: 0.8rem;"></span></label>
                    <input type="text" id="aPassword" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Permissions</label>
                    <div class="perm-grid">
                        <label class="perm-item"><input type="checkbox" name="perm" value="manage_students"> Students Management</label>
                        <label class="perm-item"><input type="checkbox" name="perm" value="manage_videos"> Video Pricing</label>
                        <label class="perm-item"><input type="checkbox" name="perm" value="manage_codes"> Codes Management</label>
                        <label class="perm-item"><input type="checkbox" name="perm" value="manage_requests"> Requests/Coins</label>
                        <label class="perm-item"><input type="checkbox" name="perm" value="manage_exams"> Exam Management</label>
                        <label class="perm-item"><input type="checkbox" name="perm" value="manage_admins"> Admins & Settings</label>
                    </div>
                </div>
                <div class="flex gap-4 mt-6" style="justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Admin</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!window.app.token || !window.app.user?.permissions?.includes('manage_admins')) {
            window.location.href = '/admin.html';
        }

        let isEditing = false;
        let allAdmins = [];

        async function loadAdmins() {
            try {
                const data = await window.app.apiCall('/admin/admins');
                allAdmins = data.admins || [];
                renderAdmins();
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        }

        function renderAdmins() {
            const tbody = document.getElementById('adminsBody');
            tbody.innerHTML = '';
            allAdmins.forEach(ad => {
                const tr = document.createElement('tr');
                const permsHtml = ad.permissions.map(p => `<span class="perm-badge">${p.replace('manage_', '')}</span>`).join('');
                
                const isSuperAdmin = ad.email.toLowerCase() === 'admin@admin.com';
                const deleteBtn = isSuperAdmin ? '' : `<button class="btn btn-secondary btn-sm" style="background:var(--error);color:white;border-color:var(--error);" onclick="deleteAdmin(${ad.id})">Delete</button>`;

                tr.innerHTML = `
                    <td>${ad.id}</td>
                    <td>${ad.name}</td>
                    <td>${ad.email}</td>
                    <td>${permsHtml}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="editAdmin(${ad.id})">Edit</button>
                        ${deleteBtn}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal() {
            isEditing = false;
            document.getElementById('modalTitle').textContent = 'Add Administrator';
            document.getElementById('pwdHint').textContent = '(Required)';
            document.getElementById('adminForm').reset();
            document.getElementById('adminId').value = '';
            document.getElementById('aPassword').required = true;
            document.getElementById('aEmail').disabled = false;
            document.getElementById('adminModal').classList.add('active');
        }

        function closeModal() { document.getElementById('adminModal').classList.remove('active'); }

        function editAdmin(id) {
            isEditing = true;
            const ad = allAdmins.find(a => a.id === id);
            document.getElementById('modalTitle').textContent = 'Edit Administrator';
            document.getElementById('pwdHint').textContent = '(Leave blank to keep unchanged)';
            document.getElementById('adminId').value = ad.id;
            document.getElementById('aName').value = ad.name;
            document.getElementById('aEmail').value = ad.email;
            document.getElementById('aPassword').value = '';
            document.getElementById('aPassword').required = false;
            document.getElementById('aEmail').disabled = (ad.email.toLowerCase() === 'admin@admin.com');
            
            // Check checkboxes
            document.querySelectorAll('input[name="perm"]').forEach(cb => {
                cb.checked = ad.permissions.includes(cb.value);
            });
            
            document.getElementById('adminModal').classList.add('active');
        }

        async function deleteAdmin(id) {
            if (!confirm('Are you sure you want to delete this admin account?')) return;
            try {
                const data = await window.app.apiCall(`/admin/admins/${id}`, 'DELETE');
                window.showNotification(data.message);
                loadAdmins();
            } catch(err) { window.showNotification(err.message, 'error'); }
        }

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const perms = Array.from(document.querySelectorAll('input[name="perm"]:checked')).map(cb => cb.value);
            const payload = {
                name: document.getElementById('aName').value,
                email: document.getElementById('aEmail').value,
                password: document.getElementById('aPassword').value,
                permissions: perms
            };

            const url = isEditing ? `/admin/admins/${document.getElementById('adminId').value}` : `/admin/admins`;
            const method = isEditing ? 'PUT' : 'POST';

            try {
                const data = await window.app.apiCall(url, method, payload);
                window.showNotification(data.message);
                closeModal();
                loadAdmins();
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        });

        loadAdmins();
    </script>
</body>
</html>
