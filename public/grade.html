<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Platform - Grades</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .video-card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
        }
        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--surface-hover);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            object-fit: cover;
            position: relative;
            overflow: hidden;
        }
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
        
        /* Video Modal Player */
        #videoModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #videoModal.active {
            display: flex;
        }
        #videoPlayer {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius);
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body data-auth="guest">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform
            </a>
            <div class="nav-links">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="dashboard.html" data-i18n="nav_dashboard" class="auth-student">Dashboard</a>
                <a href="admin.html" data-i18n="nav_admin" class="auth-user auth-admin">Admin</a>
                <div class="card" style="padding: 0.25rem 0.5rem; display: inline-block;">
                    <span class="coins-display" style="color: var(--warning); font-weight: bold;">0</span> Coins
                </div>
                <a href="#" data-i18n="nav_logout" class="btn btn-secondary logout-btn auth-user">Logout</a>
                <select id="langSwitcher" class="form-control" style="width: auto; padding: 0.25rem 0.5rem; height: auto;">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container mt-8 mb-8">
        <h2 id="gradeTitle" class="mb-4">Grade Videos</h2>
        <div id="videoContainer" class="grid">
            <!-- Videos inject here -->
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="videoModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <video id="videoPlayer" controls controlsList="nodownload" oncontextmenu="return false;"></video>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!window.app.token) {
            window.location.href = '/login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const gradeLevel = urlParams.get('level') || 'grade1'; // default
        
        document.getElementById('gradeTitle').textContent = window.i18n.t(`btn_${gradeLevel}`) + ' Videos';

        let lastPositionSaveTime = 0;
        const videoPlayer = document.getElementById('videoPlayer');
        let currentPlayingId = null;

        async function loadVideos() {
            try {
                const data = await window.app.apiCall(`/videos/${gradeLevel}`);
                renderVideos(data.videos);
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        }

        function renderVideos(videos) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            
            if (videos.length === 0) {
                container.innerHTML = '<p>No videos available for this grade.</p>';
                return;
            }

            videos.forEach(vid => {
                const el = document.createElement('div');
                el.className = 'card video-card';
                
                let actionBtnHTML = '';
                if (vid.isUnlocked || window.app.user.role === 'admin') {
                    actionBtnHTML = `<button id="btn-action-${vid.id}" class="btn btn-primary" onclick="playVideo('${vid.id}', ${vid.lastPosition})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> <span data-i18n="play_video">Play Video</span></button>`;
                } else {
                    const price = vid.price ?? 1;
                    actionBtnHTML = `
                        <button id="btn-action-${vid.id}" class="btn btn-secondary" onclick="unlockVideo('${vid.id}', this, ${price})">
                            🔓 <span>Unlock for ${price} Coin${price !== 1 ? 's' : ''}</span>
                        </button>
                    `;
                }

                el.innerHTML = `
                    <div class="video-thumbnail" style="cursor: pointer;" onclick="document.getElementById('btn-action-${vid.id}').click()">
                        ${vid.isUnlocked || window.app.user.role === 'admin' ? '' : '<div class="lock-overlay"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>'}
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z"></path><rect x="3" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
                    </div>
                    <h3 style="font-size: 1.1rem; word-break: break-all;">${vid.title}</h3>
                    <div class="mt-auto">
                        <p class="text-muted" style="font-size: 0.8rem; margin-bottom: 0.5rem;">${vid.isUnlocked ? '<span style="color:var(--success)">Unlocked ✅</span>' : `Locked 🔒 — ${vid.price ?? 1} Coin${(vid.price ?? 1) !== 1 ? 's' : ''}`}</p>
                        ${actionBtnHTML}
                    </div>
                `;
                container.appendChild(el);
            });
            window.i18n.applyLanguage();
        }

        window.unlockVideo = async (videoId, btnElement, price) => {
            const originalText = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round"></circle></svg> Unlocking...`;
            
            try {
                const data = await window.app.apiCall('/videos/unlock', 'POST', { videoId });
                window.showNotification(data.message, 'success');
                // Refresh Me to update coins
                const me = await window.app.apiCall('/auth/me');
                window.app.setAuth(window.app.token, me.user);
                
                loadVideos();

                // Auto-play immediately after unlock
                playVideo(videoId, 0);
            } catch (err) {
                btnElement.disabled = false;
                btnElement.innerHTML = originalText;
                window.showNotification(err.message, 'error');
            }
        };

        window.playVideo = (videoId, startPosition) => {
            currentPlayingId = videoId;
            const modal = document.getElementById('videoModal');
            videoPlayer.src = `/api/videos/stream/${videoId}?token=${window.app.token}`;
            
            // Wait for metadata to set current time
            videoPlayer.onloadedmetadata = () => {
                videoPlayer.currentTime = startPosition || 0;
            };

            modal.classList.add('active');
            videoPlayer.play();
        };

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('videoModal').classList.remove('active');
            currentPlayingId = null;
            videoPlayer.pause();
            videoPlayer.src = ''; // Stop downloading
        });

        // Track Progress
        videoPlayer.addEventListener('timeupdate', () => {
            if (!currentPlayingId) return;
            const now = Date.now();
            if (now - lastPositionSaveTime > 5000) { // Throttle 5 seconds
                lastPositionSaveTime = now;
                window.app.apiCall(`/videos/progress/${currentPlayingId}`, 'POST', { position: videoPlayer.currentTime }).catch(()=>{});
            }
        });

        loadVideos();
    </script>
</body>
</html>
