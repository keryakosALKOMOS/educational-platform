<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Video Prices - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .video-price-card {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .video-title {
            font-weight: 600;
            font-size: 1rem;
            word-break: break-all;
            height: 3rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .price-input-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--surface-hover);
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius);
        }
        .price-input-group label {
            font-size: 0.875rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .price-input-group input {
            background: transparent;
            border: none;
            color: var(--text);
            font-weight: 700;
            width: 100%;
            font-size: 1.125rem;
            outline: none;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-weight: 600;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .save-bar {
            position: sticky;
            top: 5rem;
            z-index: 100;
            background: var(--surface);
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body data-auth="guest">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform Admin
            </a>
            <div class="nav-links">
                <a href="admin.html">Dashboard</a>
                <a href="#" data-i18n="nav_logout" class="btn btn-secondary logout-btn auth-user">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-8 pb-20">
        <div class="flex items-center justify-between mb-6">
            <h2>🎬 Manage Video Prices</h2>
            <a href="admin.html" class="btn btn-secondary">Back to Dashboard</a>
        </div>

        <div class="save-bar">
            <p class="text-muted">Set individual prices for each video. Click save to apply all changes.</p>
            <button id="btnSaveAll" class="btn btn-primary">💾 Save All Changes</button>
        </div>

        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('grade1')">Grade 1</div>
            <div class="tab-btn" onclick="switchTab('grade2')">Grade 2</div>
            <div class="tab-btn" onclick="switchTab('grade3')">Grade 3</div>
        </div>

        <div id="grade1" class="tab-content active">
            <div class="video-grid" id="grid-grade1"></div>
        </div>
        <div id="grade2" class="tab-content">
            <div class="video-grid" id="grid-grade2"></div>
        </div>
        <div id="grade3" class="tab-content">
            <div class="video-grid" id="grid-grade3"></div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!window.app.token || window.app.user.role !== 'admin') {
            window.location.href = '/login.html';
        }

        let allVideos = [];

        async function loadVideos() {
            try {
                const data = await window.app.apiCall('/admin/video-prices');
                allVideos = data.videos;
                renderGrids();
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        }

        function renderGrids() {
            const grades = ['grade1', 'grade2', 'grade3'];
            grades.forEach(grade => {
                const grid = document.getElementById(`grid-${grade}`);
                grid.innerHTML = '';
                
                const filtered = allVideos.filter(v => v.grade === grade);
                if (filtered.length === 0) {
                    grid.innerHTML = '<p class="text-muted">No videos found for this grade.</p>';
                    return;
                }

                filtered.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'card video-price-card';
                    card.innerHTML = `
                        <div class="video-title">${v.title}</div>
                        <div class="price-input-group">
                            <label>Price (Coins):</label>
                            <input type="number" value="${v.price}" min="0" max="9999" data-path="${v.video_path}">
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function switchTab(grade) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(grade).classList.add('active');
        }

        document.getElementById('btnSaveAll').addEventListener('click', async () => {
            const btn = document.getElementById('btnSaveAll');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Saving...';

            const inputs = document.querySelectorAll('input[data-path]');
            const updates = Array.from(inputs).map(i => ({
                video_path: i.dataset.path,
                price: parseInt(i.value) || 0
            }));

            try {
                const data = await window.app.apiCall('/admin/video-prices', 'PUT', { updates });
                window.showNotification(data.message, 'success');
            } catch (err) {
                window.showNotification(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        loadVideos();
    </script>
</body>
</html>
