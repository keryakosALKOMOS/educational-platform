<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Platform - Exam Reports</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--surface-hover);
            font-weight: 600;
        }
        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: none;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body data-auth="guest">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform Admin
            </a>
            <div class="nav-links">
                <a href="admin.html" class="btn btn-secondary">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mt-8">
        <div class="flex items-center justify-between mb-4">
            <h2>📊 Exam Reports</h2>
            <div>
                <button onclick="window.print()" class="btn btn-primary" style="margin-right:0.5rem;">🖨 Print / PDF</button>
                <a href="admin.html" class="btn btn-secondary">Back to Admin</a>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Exam Title</th>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Class Time</th>
                        <th>Score</th>
                        <th>Ended At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reportsTableBody">
                    <tr><td colspan="8" style="text-align:center;">Loading reports...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!window.app.token || window.app.user?.role !== 'admin') {
            window.location.href = '/login.html';
        }

        async function loadReports() {
            try {
                const data = await window.app.apiCall('/admin/reports');
                const reports = data.reports;
                const tbody = document.getElementById('reportsTableBody');
                
                if (reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">No reports available. Exams must end to generate reports.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = '';
                reports.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${r.id}</td>
                        <td style="font-weight:600;">${r.exam_title}</td>
                        <td>${r.student_name}</td>
                        <td>${r.student_email}</td>
                        <td>${r.class_time || 'N/A'}</td>
                        <td style="font-weight:bold; color:var(--primary);">${r.score} / ${r.total_questions}</td>
                        <td>${new Date(r.ended_at).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteReport(${r.id})">🗑 Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        }

        window.deleteReport = async (id) => {
            if (!confirm('Are you sure you want to delete this report?')) return;
            try {
                await window.app.apiCall(`/admin/reports/${id}`, 'DELETE');
                window.showNotification('Report deleted', 'success');
                loadReports();
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        };

        loadReports();
    </script>
</body>
</html>
