<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Platform - Exam Reports</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--surface-hover);
            font-weight: 600;
        }
        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: none;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Print Specific Styles */
        @media print {
            .no-print {
                display: none !important;
            }
            
            /* Hide everything else when printing a single report */
            body.print-single .navbar,
            body.print-single .page-header {
                display: none !important;
            }
            body.print-single .table-wrapper:not(.printing-now) {
                display: none !important;
            }
            body.print-single .printing-now {
                border: none;
                margin: 0;
            }
        }
    </style>
</head>
<body data-auth="guest">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform Admin
            </a>
            <div class="nav-links">
                <a href="admin.html" class="btn btn-secondary">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mt-8">
        <div class="flex items-center justify-between mb-4 page-header">
            <h2>📊 Exam Reports</h2>
            <div>
                <button onclick="window.print()" class="btn btn-primary" style="margin-right:0.5rem;">🖨 Print / PDF</button>
                <a href="admin.html" class="btn btn-secondary">Back to Admin</a>
            </div>
        </div>

        <div id="reportsContainer">
            <div class="table-wrapper">
                <p style="text-align:center;">Loading reports...</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!window.app.token || window.app.user?.role !== 'admin') {
            window.location.href = '/login.html';
        }

        async function loadReports() {
            try {
                const data = await window.app.apiCall('/admin/reports');
                const reports = data.reports || [];
                const container = document.getElementById('reportsContainer');
                
                if (reports.length === 0) {
                    container.innerHTML = '<div class="table-wrapper"><p style="text-align:center;color:var(--text-muted)">No reports available.</p></div>';
                    return;
                }
                
                // Group by Exam Title
                const grouped = {};
                reports.forEach(r => {
                    const title = r.exam_title || 'Unknown Exam';
                    if (!grouped[title]) grouped[title] = [];
                    grouped[title].push(r);
                });

                container.innerHTML = '';
                
                let groupIndex = 0;
                for (let title in grouped) {
                    const groupId = 'exam-group-' + groupIndex++;
                    const section = document.createElement('div');
                    section.id = groupId;
                    section.className = 'table-wrapper';
                    section.style.marginBottom = '2rem';
                    
                    let tableHtml = `
                        <div style="display:flex; justify-content:space-between; border-bottom:2px solid var(--border); padding-bottom:0.5rem; margin-bottom:1rem; align-items:center;">
                            <h3 style="margin:0; color:var(--primary);">📘 ${title}</h3>
                            <button class="btn btn-sm btn-secondary" onclick="printExam('${groupId}')">🖨 Print This Exam</button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Student Name</th>
                                    <th>Email</th>
                                    <th>Class Time</th>
                                    <th>Score</th>
                                    <th>Submitted At</th>
                                    <th class="no-print">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    grouped[title].forEach(r => {
                        tableHtml += `
                            <tr>
                                <td>${r.id}</td>
                                <td style="font-weight:600;">${r.student_name}</td>
                                <td>${r.student_email}</td>
                                <td>${r.class_time || 'N/A'}</td>
                                <td style="font-weight:bold; color:var(--success);">${r.score} / ${r.total_questions}</td>
                                <td>${new Date(r.submitted_at || r.ended_at).toLocaleString()}</td>
                                <td class="no-print">
                                    <button class="btn btn-sm btn-danger" onclick="deleteReport(${r.id})">🗑 Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    tableHtml += `</tbody></table>`;
                    section.innerHTML = tableHtml;
                    container.appendChild(section);
                }
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        }

        window.printExam = (groupId) => {
            const wrapper = document.getElementById(groupId);
            if (!wrapper) return;
            
            document.body.classList.add('print-single');
            wrapper.classList.add('printing-now');
            
            window.print();
            
            setTimeout(() => {
                document.body.classList.remove('print-single');
                wrapper.classList.remove('printing-now');
            }, 1000);
        };

        window.deleteReport = async (id) => {
            if (!confirm('Are you sure you want to delete this report?')) return;
            try {
                await window.app.apiCall(`/admin/reports/${id}`, 'DELETE');
                window.showNotification('Report deleted', 'success');
                loadReports();
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        };

        loadReports();
    </script>
</body>
</html>
