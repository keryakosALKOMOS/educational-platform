<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Platform - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ---- Stats ---- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-align: center;
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* ---- Admin Settings Panel ---- */
        .admin-code-settings {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
        }
        .admin-code-settings h3 {
            margin: 0 0 1rem 0;
            font-size: 1rem;
        }
        .admin-code-settings-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            align-items: flex-end;
        }
        .admin-settings-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .admin-settings-field label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .admin-settings-field input[type="number"] {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) - 2px);
            background: var(--surface-hover);
            color: var(--text-main);
            font-size: 0.95rem;
            width: 130px;
        }
        .admin-settings-field input[type="number"]:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        /* ---- Batch Cards ---- */
        .batches-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .batches-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .batch-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .batch-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .batch-header:hover { background: var(--surface-hover); }
        .batch-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 8px;
            padding: 0.3rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .batch-meta {
            flex: 1;
            min-width: 0;
        }
        .batch-meta-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }
        .batch-meta-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .batch-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            white-space: nowrap;
        }
        .pill-success { background: rgba(16,185,129,0.12); color: var(--success); }
        .pill-error   { background: rgba(239,68,68,0.12);  color: var(--error);   }
        .pill-info    { background: rgba(79,70,229,0.12);  color: var(--primary); }
        .batch-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-left: auto;
        }
        .btn-sm {
            padding: 0.4rem 0.85rem;
            font-size: 0.8rem;
            border-radius: 8px;
        }
        .batch-chevron {
            transition: transform 0.25s;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .batch-card.open .batch-chevron { transform: rotate(180deg); }
        .batch-body {
            display: none;
            border-top: 1px solid var(--border);
            overflow-x: auto;
        }
        .batch-card.open .batch-body { display: block; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.65rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }
        [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
        th { background: var(--surface-hover); font-weight: 600; }
        tr:last-child td { border-bottom: none; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state svg { margin-bottom: 1rem; opacity: 0.4; }
    </style>
</head>
<body data-auth="guest">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                EduPlatform Admin
            </a>
            <div class="nav-links">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="grade.html?level=grade1" data-i18n="btn_grade1">Grade 1</a>
                <a href="settings.html" data-i18n="nav_settings">⚙ Settings</a>
                <a href="#" data-i18n="nav_logout" class="btn btn-secondary logout-btn auth-user">Logout</a>
                <select id="langSwitcher" class="form-control" style="width: auto; padding: 0.25rem 0.5rem; height: auto;">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container mt-8">

        <!-- Page Header -->
        <div class="flex items-center justify-between mb-4 gap-2">
            <h2 data-i18n="nav_admin">Admin Panel</h2>
            <div class="flex gap-2" id="adminActionBtns">
                <!-- Buttons injected by JS based on permissions -->
            </div>
        </div>

        <!-- Settings Panel -->
        <div id="settingsPanelContainer"></div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalBatches">0</div>
                <div class="text-muted">Total Batches</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCodes">0</div>
                <div class="text-muted" data-i18n="stats_total_codes">Total Codes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="usedCodes">0</div>
                <div class="text-muted" data-i18n="stats_used_codes">Used Codes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="availableCodes">0</div>
                <div class="text-muted">Available Codes</div>
            </div>
        </div>

        <!-- Batches List -->
        <div class="batches-header">
            <h3 style="margin:0;">📦 Code Batches</h3>
        </div>

        <div class="batches-list" id="batchesList">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <p>No batches yet. Click "Generate Codes" to create the first batch.</p>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/bg-animation.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!window.app.token || window.app.user?.role !== 'admin') {
            window.location.href = '/login.html';
        }

        const getPerms = () => window.app.user?.permissions || [];

        function renderAdminHeader() {
            const container = document.getElementById('adminActionBtns');
            if (!container) return;
            container.innerHTML = '';
            const perms = getPerms();
            if (perms.includes('manage_videos')) {
                container.innerHTML += `<a href="admin-videos.html" class="btn btn-primary">🎬 Manage Videos</a>`;
            }
            if (perms.includes('manage_students')) {
                container.innerHTML += `<a href="admin-students.html" class="btn btn-primary">🎓 Manage Students</a>`;
            }
            if (perms.includes('manage_exams')) {
                container.innerHTML += `<a href="admin-exam-generator.html" class="btn btn-primary" style="background: #8b5cf6; border-color: #8b5cf6;">✨ Generate Exam</a>`;
                container.innerHTML += `<a href="admin-reports.html" class="btn btn-secondary">📊 Reports</a>`;
            }
            if (perms.includes('manage_admins')) {
                container.innerHTML += `<a href="admin-admins.html" class="btn btn-secondary" style="background:var(--secondary);border-color:var(--secondary);">👥 Manage Admins</a>`;
            }
        }

        function renderSettingsPanel() {
            const container = document.getElementById('settingsPanelContainer');
            if (!container) return;
            const perms = getPerms();
            if (perms.includes('manage_codes') || perms.includes('manage_admins')) {
                container.innerHTML = `
                    <div class="admin-code-settings">
                        <h3>⚙️ Code Generation Settings</h3>
                        <div class="admin-code-settings-row">
                            ${perms.includes('manage_admins') ? `
                            <div class="admin-settings-field">
                                <label for="inputCodesBatch">Codes per Batch</label>
                                <input type="number" id="inputCodesBatch" min="1" max="10000" value="500" placeholder="e.g. 500">
                            </div>
                            <div class="admin-settings-field">
                                <label for="inputCoinsPerCode">Coins per Code</label>
                                <input type="number" id="inputCoinsPerCode" min="1" max="100" value="1" placeholder="e.g. 1">
                            </div>
                            <div class="admin-settings-field">
                                <label>&nbsp;</label>
                                <button id="btnSaveSettings" class="btn btn-secondary btn-sm" style="height:fit-content; padding: 0.5rem 1rem;">💾 Save Settings</button>
                            </div>
                            ` : ''}
                            ${perms.includes('manage_codes') ? `
                            <div class="admin-settings-field" style="margin-left: auto;">
                                <label>&nbsp;</label>
                                <button id="btnGenerate" class="btn btn-primary" style="height:fit-content;">
                                    ✨ Generate <span id="generateCountLabel">500</span> Codes
                                </button>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                attachSettingsListeners();
            }
        }

        function attachSettingsListeners() {
            const inputBatch = document.getElementById('inputCodesBatch');
            const btnSave = document.getElementById('btnSaveSettings');
            const btnGen = document.getElementById('btnGenerate');

            if (inputBatch) {
                inputBatch.addEventListener('input', function() {
                    const val = parseInt(this.value);
                    if (!isNaN(val) && val > 0) {
                        const lbl = document.getElementById('generateCountLabel');
                        if (lbl) lbl.textContent = val;
                    }
                });
            }

            if (btnSave) {
                btnSave.addEventListener('click', async () => {
                    const codesVal = parseInt(document.getElementById('inputCodesBatch').value);
                    const coinsVal = parseInt(document.getElementById('inputCoinsPerCode').value);
                    // ... same validation and api call ...
                    try {
                        const data = await window.app.apiCall('/admin/settings', 'PUT', {
                            codes_per_batch: codesVal, coins_per_code: coinsVal
                        });
                        window.showNotification(data.message, 'success');
                    } catch (err) { window.showNotification(err.message, 'error'); }
                });
            }

            if (btnGen) {
                btnGen.addEventListener('click', async () => {
                    const btn = document.getElementById('btnGenerate');
                    btn.disabled = true;
                    btn.textContent = 'Generating…';
                    try {
                        const data = await window.app.apiCall('/codes/generate', 'POST');
                        window.showNotification(data.message, 'success');
                        loadBatches();
                    } catch (err) {
                        window.showNotification(err.message, 'error');
                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = '✨ Generate <span id="generateCountLabel">' +
                            (document.getElementById('inputCodesBatch')?.value || '500') + '</span> Codes';
                    }
                });
            }
        }

        renderAdminHeader();
        renderSettingsPanel();

        // One-time refresh of user data to catch new permissions
        (async function refreshUser() {
            try {
                const data = await window.app.apiCall('/auth/me');
                window.app.setAuth(window.app.token, data.user);
                // If permissions changed, we might need to re-render, but let's at least ensure they are there for next reload
                // For now, if perms were empty and now they aren't, just reload once
                const currentPerms = getPerms();
                if (currentPerms.length === 0 && data.user.permissions.length > 0) {
                    window.location.reload();
                }
            } catch(e) {}
        })();

        // ---- Load settings ----
        async function loadSettings() {
            if (!getPerms().includes('manage_admins')) return;
            try {
                const data = await window.app.apiCall('/admin/settings');
                const s = data.settings;
                const codesVal = parseInt(s.codes_per_batch || '500');
                const coinsVal = parseInt(s.coins_per_code || '1');
                if (document.getElementById('inputCodesBatch')) {
                    document.getElementById('inputCodesBatch').value = codesVal;
                    document.getElementById('inputCoinsPerCode').value = coinsVal;
                    const lbl = document.getElementById('generateCountLabel');
                    if (lbl) lbl.textContent = codesVal;
                }
            } catch (err) {
                window.showNotification('Could not load settings: ' + err.message, 'error');
            }
        }

        // Cleanup: remove duplicate listeners that were previously at global scope

        // ---- Load batches ----
        async function loadBatches() {
            try {
                const data = await window.app.apiCall('/codes/batches');
                const batches = data.batches;
                const list = document.getElementById('batchesList');

                let totalCodes = 0, totalUsed = 0, totalAvailable = 0;

                if (batches.length === 0) {
                    list.innerHTML = `<div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                        <p>No batches yet. Click "Generate Codes" to create the first batch.</p>
                    </div>`;
                } else {
                    list.innerHTML = '';
                    batches.forEach(b => {
                        totalCodes     += b.count;
                        totalUsed      += b.used_count;
                        totalAvailable += b.available_count;
                        list.appendChild(buildBatchCard(b));
                    });
                }

                document.getElementById('totalBatches').textContent   = batches.length;
                document.getElementById('totalCodes').textContent      = totalCodes;
                document.getElementById('usedCodes').textContent       = totalUsed;
                document.getElementById('availableCodes').textContent  = totalAvailable;
            } catch (err) {
                window.showNotification(err.message, 'error');
            }
        }

        function buildBatchCard(batch) {
            const card = document.createElement('div');
            card.className = 'batch-card';
            card.dataset.batchId = batch.id;

            const date = new Date(batch.created_at).toLocaleString();
            const usedPct = batch.count > 0 ? Math.round((batch.used_count / batch.count) * 100) : 0;

            card.innerHTML = `
                <div class="batch-header" onclick="toggleBatch(this)">
                    <span class="batch-badge">Batch #${batch.id}</span>
                    <div class="batch-meta">
                        <div class="batch-meta-title">${batch.count} codes · ${batch.coins_per_code} coin(s) each</div>
                        <div class="batch-meta-sub">${date}</div>
                    </div>
                    <div class="batch-pills">
                        <span class="pill pill-success">✅ ${batch.available_count} Available</span>
                        <span class="pill pill-error">🔴 ${batch.used_count} Used</span>
                        <span class="pill pill-info">${usedPct}% used</span>
                    </div>
                    <div class="batch-actions">
                        <a href="print-codes.html?batch=${batch.id}" target="_blank" class="btn btn-secondary btn-sm" onclick="event.stopPropagation()">
                            🖨 Print
                        </a>
                    </div>
                    <svg class="batch-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="batch-body">
                    <div class="batch-table-container" id="batchTable_${batch.id}">
                        <div style="padding: 1.5rem; text-align:center; color: var(--text-muted);">Loading codes…</div>
                    </div>
                </div>
            `;
            return card;
        }

        function toggleBatch(headerEl) {
            const card = headerEl.closest('.batch-card');
            const wasOpen = card.classList.contains('open');
            card.classList.toggle('open');

            if (!wasOpen) {
                // Load table on first expand
                const batchId = card.dataset.batchId;
                const container = document.getElementById('batchTable_' + batchId);
                if (container && container.dataset.loaded !== 'true') {
                    loadBatchTable(batchId, container);
                }
            }
        }

        async function loadBatchTable(batchId, container) {
            try {
                const data = await window.app.apiCall('/codes/batch/' + batchId);
                const codes = data.codes;
                container.dataset.loaded = 'true';

                if (codes.length === 0) {
                    container.innerHTML = '<div style="padding:1rem; text-align:center; color:var(--text-muted)">No codes found.</div>';
                    return;
                }

                const table = document.createElement('table');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Status</th>
                            <th>Used By</th>
                            <th>Used At</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                const tbody = table.querySelector('tbody');
                codes.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${c.id}</td>
                        <td style="font-family: monospace; font-weight: bold; letter-spacing: 2px;">${c.code}</td>
                        <td><span style="color:${c.is_used ? 'var(--error)' : 'var(--success)'}; font-weight:600;">${c.is_used ? 'Used' : 'Available'}</span></td>
                        <td>${c.used_by || '-'}</td>
                        <td>${c.used_at ? new Date(c.used_at).toLocaleString() : '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
                container.innerHTML = '';
                container.appendChild(table);
            } catch (err) {
                container.innerHTML = `<div style="padding:1rem; color:var(--error)">Error: ${err.message}</div>`;
            }
        }

        if (getPerms().includes('manage_admins')) {
            loadSettings();
        }
        if (getPerms().includes('manage_codes')) {
            loadBatches();
        }
    </script>
</body>
</html>
